# GoReleaser builds release artifacts for ezyl3. Homebrew formula publishing is
# handled by the release workflow from the generated archives and checksums.
version: 2

project_name: ezyl3

before:
  hooks:
    - go mod tidy

builds:
  - id: ezyl3
    main: ./cmd/ezyl3
    binary: ezyl3
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X ezyl3/internal/version.Version={{ .Version }}

archives:
  - id: ezyl3
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: tlarevo
    name: ezyl3
